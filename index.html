<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link stylesheet"">
    <title>Minha Página Simples</title>
    
</head>
<body>
    <div class="container">
        <h1>Bem-vindo!</h1>
        <p>Esta é uma página HTML simples com um pouco de estilo CSS.</p>
        <p>Aqui você pode adicionar seu conteúdo, imagens, links e muito mais!</p>
        
        <button onclick="mostrarMensagem()">Clique aqui</button>
        
        <p id="mensagem"></p>
    </div>
    
    <script>
        function mostrarMensagem() {
            document.getElementById('mensagem').innerHTML = '✓ Que caceta memo!';
            document.getElementById('mensagem').style.color = '#4CAF50';
            document.getElementById('mensagem').style.textAlign = 'center';
            document.getElementById('mensagem').style.fontWeight = 'bold';
        }
    </script>
</body>
</html>
